services:
  docs:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - npm install -g mint --no-audit --no-fund && exec mint dev --no-open --host --no-telemetry
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - HOST=0.0.0.0
    volumes:
      - .:/app
    restart: on-failure
    labels:
      base44.project: AKPS Build Empire Crown Team
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 240s
